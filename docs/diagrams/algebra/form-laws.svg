<text class="m c" style="fill:#a0522d" x="114" y="833.5" xml:space="preserve">q</text>
<rect class="box" style="stroke:#2f5d8a" x="104" y="845" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#2f5d8a" x="114" y="859.5" xml:space="preserve">r</text>
<text class="big" x="175" y="850" xml:space="preserve">≠</text>
<path class="edge" style="stroke:#1f1f1f" d="M240,842 L284,829"/>
<text class="n g" x="272" y="822" xml:space="preserve">0</text>
<path class="edge" style="stroke:#1f1f1f" d="M240,842 L284,855"/>
<text class="n g" x="272" y="870" xml:space="preserve">1</text>
<rect class="box" style="stroke:#1f1f1f" x="220" y="832" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#1f1f1f" x="230" y="846.5" xml:space="preserve">e</text>
<rect class="box" style="stroke:#2f5d8a" x="284" y="819" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#2f5d8a" x="294" y="833.5" xml:space="preserve">r</text>
<rect class="box" style="stroke:#a0522d" x="284" y="845" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#a0522d" x="294" y="859.5" xml:space="preserve">q</text>
<text class="s" x="480" y="826" xml:space="preserve">A slot’s index is part of its path, and its id and seed come</text>
<text class="s" x="480" y="842" xml:space="preserve">from the path. Swapping two children gives each the</text>
<text class="s" x="480" y="858" xml:space="preserve">other’s seed, so each is drawn differently.</text>
<text class="s" x="30" y="900" xml:space="preserve">Every tree on this page was computed by the definition of then (substitution at the buds); the equal pairs were checked equal when the figure was made.</text>
<text class="s" x="30" y="918" xml:space="preserve">That is one example per law, not a proof. Slice 1a is to test each law over generated rules and contexts.</text>
</svg>
