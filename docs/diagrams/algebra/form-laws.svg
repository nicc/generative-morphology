<text class="big" x="630" y="134" xml:space="preserve">=</text>
<path class="lead" d="M30,198 L930,198"/>
<text class="m" x="30" y="228" xml:space="preserve">F2  then(bud, f) = f = then(f, bud)</text>
<text class="s" x="480" y="228" xml:space="preserve">bud is the identity: continuing with it changes nothing</text>
<circle class="box" style="stroke:#1f1f1f" cx="57" cy="271" r="6"/>
<text class="c" x="92" y="289" xml:space="preserve">then</text>
