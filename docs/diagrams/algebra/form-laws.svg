<circle class="box" style="stroke:#1f1f1f" cx="303" cy="259" r="6"/>
<circle class="box" style="stroke:#1f1f1f" cx="303" cy="285" r="6"/>
<text class="big" x="345" y="280" xml:space="preserve">=</text>
<path class="edge" style="stroke:#1f1f1f" d="M400,272 L426,259"/>
<path class="edge" style="stroke:#1f1f1f" d="M400,272 L426,285"/>
<rect class="box" style="stroke:#1f1f1f" x="380" y="262" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#1f1f1f" x="390" y="276.5" xml:space="preserve">a</text>
<circle class="box" style="stroke:#1f1f1f" cx="433" cy="259" r="6"/>
<circle class="box" style="stroke:#1f1f1f" cx="433" cy="285" r="6"/>
<text class="c" x="472" y="289" xml:space="preserve">then</text>
<circle class="box" style="stroke:#1f1f1f" cx="507" cy="271" r="6"/>
<text class="s" x="580" y="262" xml:space="preserve">A lone bud becomes f. Each of f’s buds,</text>
<text class="s" x="580" y="278" xml:space="preserve">replaced by a bud, is still a bud.</text>
<path class="lead" d="M30,320 L930,320"/>
<text class="m" x="30" y="350" xml:space="preserve">F3  then(closed, f) = closed</text>
<text class="s" x="480" y="350" xml:space="preserve">closed is a left zero: no open bud, so nowhere for f to grow</text>
<circle class="box" style="fill:#1f1f1f;stroke:#1f1f1f" cx="57" cy="385" r="4.5"/>
<text class="c" x="92" y="403" xml:space="preserve">then</text>
<path class="edge" style="stroke:#1f1f1f" d="M140,386 L166,373"/>
<path class="edge" style="stroke:#1f1f1f" d="M140,386 L166,399"/>
<rect class="box" style="stroke:#1f1f1f" x="120" y="376" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#1f1f1f" x="130" y="390.5" xml:space="preserve">a</text>
<circle class="box" style="stroke:#1f1f1f" cx="173" cy="373" r="6"/>
<circle class="box" style="stroke:#1f1f1f" cx="173" cy="399" r="6"/>
<text class="big" x="215" y="396" xml:space="preserve">=</text>
<circle class="box" style="fill:#1f1f1f;stroke:#1f1f1f" cx="257" cy="385" r="4.5"/>
<path class="lead" d="M30,434 L930,434"/>
<text class="m" x="30" y="464" xml:space="preserve">F4  then(grow(e, f₁, f₂), h) = grow(e, then(f₁, h), then(f₂, h))</text>
<text class="s" x="580" y="464" xml:space="preserve">then passes through an element to its children</text>
<text class="m" x="40" y="498" xml:space="preserve">grow(e, f₁, f₂)</text>
