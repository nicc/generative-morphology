<text class="t" x="30" y="36" xml:space="preserve">Form laws: equations between shoots</text>
<text class="s e" x="930" y="36" xml:space="preserve">ink: built by f or e   sienna: by g   blue: by h</text>
<text class="m" x="30" y="70" xml:space="preserve">F1  then(then(f, g), h) = then(f, then(g, h))</text>
<text class="s" x="480" y="70" xml:space="preserve">associative: only the order matters, not the grouping</text>
<text class="m" x="40" y="104" xml:space="preserve">f</text>
