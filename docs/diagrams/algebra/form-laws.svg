<text class="m c" style="fill:#1f1f1f" x="410" y="538.5" xml:space="preserve">e</text>
<rect class="box" style="stroke:#1f1f1f" x="446" y="511" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#1f1f1f" x="456" y="525.5" xml:space="preserve">a</text>
<rect class="box" style="stroke:#2f5d8a" x="492" y="511" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#2f5d8a" x="502" y="525.5" xml:space="preserve">c</text>
<circle class="box" style="stroke:#2f5d8a" cx="545" cy="521" r="6"/>
<rect class="box" style="stroke:#2f5d8a" x="446" y="537" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#2f5d8a" x="456" y="551.5" xml:space="preserve">c</text>
<circle class="box" style="stroke:#2f5d8a" cx="499" cy="547" r="6"/>
<text class="s" x="600" y="514" xml:space="preserve">f₁ is a with one bud; f₂ is a lone bud. Continuing the whole</text>
<text class="s" x="600" y="530" xml:space="preserve">element with h gives the same shoot as continuing each slot</text>
<text class="s" x="600" y="546" xml:space="preserve">with h first (then(f₁, h) is a–c–○, then(f₂, h) is c–○) and</text>
<text class="s" x="600" y="562" xml:space="preserve">building e around the results.</text>
<text class="s" x="30" y="598" xml:space="preserve">What grows next grows at every open bud, however deep. This is the law that says how then and grow fit together.</text>
<path class="lead" d="M30,616 L930,616"/>
<text class="t" x="30" y="654" xml:space="preserve">Not laws: equations that look plausible and are false</text>
<text class="m" x="30" y="692" xml:space="preserve">then(grow(e, bud), closed) ≠ closed</text>
<text class="s" x="480" y="692" xml:space="preserve">no right zero (J1): a shoot that stops growing stays drawn</text>
<path class="edge" style="stroke:#1f1f1f" d="M60,721 L86,721"/>
<rect class="box" style="stroke:#1f1f1f" x="40" y="711" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#1f1f1f" x="50" y="725.5" xml:space="preserve">e</text>
<circle class="box" style="stroke:#1f1f1f" cx="93" cy="721" r="6"/>
<text class="c" x="128" y="726" xml:space="preserve">then</text>
<circle class="box" style="fill:#a0522d;stroke:#a0522d" cx="163" cy="721" r="4.5"/>
<text class="big" x="205" y="730" xml:space="preserve">=</text>
<path class="edge" style="stroke:#1f1f1f" d="M260,721 L286,721"/>
<rect class="box" style="stroke:#1f1f1f" x="240" y="711" width="20" height="20" rx="0"/>
<text class="m c" style="fill:#1f1f1f" x="250" y="725.5" xml:space="preserve">e</text>
<circle class="box" style="fill:#a0522d;stroke:#a0522d" cx="291" cy="721" r="4.5"/>
<text class="big" x="345" y="730" xml:space="preserve">≠</text>
<circle class="box" style="fill:#1f1f1f;stroke:#1f1f1f" cx="385" cy="721" r="4.5"/>
<text class="s" x="480" y="720" xml:space="preserve">e is kept, with its slot closed. If this equalled closed,</text>
<text class="s" x="480" y="736" xml:space="preserve">an axis could not end (in a flower, say) and remain.</text>
<path class="lead" d="M30,758 L930,758"/>
<text class="m" x="30" y="796" xml:space="preserve">grow(e, q, r) ≠ grow(e, r, q)</text>
<text class="s" x="480" y="796" xml:space="preserve">slots are ordered (J3)</text>
