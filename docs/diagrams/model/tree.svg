<path class="edge" marker-end="url(#arr)" d="M400,64 L1010,64"/>
<text class="s" x="1020" y="68" xml:space="preserve">contexts flow this way only</text>
<text class="s" x="400" y="596" xml:space="preserve">Cut at any slot and what it holds is a shoot: a leaf, a bud, a branch, the whole plant.</text>
<text class="s" x="400" y="612" xml:space="preserve">The phytomer is not a box in this tree. It is the rule that built each internode and filled its slots (model / rules, panel c).</text>
