<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="What a slot holds: an element, an open bud, or closed; and the shoot of plant diagram shoot a as the model holds it, a tree of elements with numbered slots, paths, bud contexts, one branch shaded as a shoot and one phytomer outlined">
<rect width="1200" height="640" fill="#fbfaf6"/>
