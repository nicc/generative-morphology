<text class="t" x="30" y="40" xml:space="preserve">a. What a slot holds</text>
<circle class="num" cx="46" cy="92" r="9"/>
<text class="n" x="46" y="96" xml:space="preserve">0</text>
<path class="edge" d="M55,92 L74,92"/>
<rect class="box" x="74" y="79" width="96" height="26" rx="0"/>
<text class="c" x="122" y="96.5" xml:space="preserve">element</text>
<text class="s" x="186" y="86" xml:space="preserve">one drawn part, with a life</text>
<text class="s" x="186" y="102" xml:space="preserve">and ordered slots of its own</text>
<circle class="num" cx="46" cy="152" r="9"/>
<text class="n" x="46" y="156" xml:space="preserve">1</text>
<path class="edge" d="M55,152 L74,152"/>
<circle class="box" style="stroke:#1f1f1f" cx="81" cy="152" r="7"/>
<text x="100" y="156.5" xml:space="preserve">bud</text>
<text class="s" x="186" y="146" xml:space="preserve">open: no element yet;</text>
<text class="s" x="186" y="162" xml:space="preserve">carries a context</text>
<circle class="num" cx="46" cy="212" r="9"/>
<text class="n" x="46" y="216" xml:space="preserve">2</text>
<path class="edge" d="M55,212 L74,212"/>
<circle class="box" style="fill:#1f1f1f;stroke:#1f1f1f" cx="79" cy="212" r="5"/>
<text x="100" y="216.5" xml:space="preserve">closed</text>
<text class="s" x="186" y="206" xml:space="preserve">grows nothing; keeps its</text>
<text class="s" x="186" y="222" xml:space="preserve">slot and its path</text>
<text class="m" x="30" y="274" xml:space="preserve">Shoot = bud(context)</text>
<text class="m" x="30" y="292" xml:space="preserve">      | closed</text>
<text class="m" x="30" y="310" xml:space="preserve">      | element(e, slots)</text>
<text class="s" x="30" y="352" xml:space="preserve">A numbered circle is a slot. Each slot holds</text>
<text class="s" x="30" y="368" xml:space="preserve">exactly one shoot, so what a slot holds is</text>
<text class="s" x="30" y="384" xml:space="preserve">again one of these three.</text>
<text class="s" x="30" y="400" xml:space="preserve"></text>
<text class="s" x="30" y="416" xml:space="preserve">A path is the slot indices from the root,</text>
<text class="s" x="30" y="432" xml:space="preserve">written 2.2.1. A slot’s id and its seed are</text>
<text class="s" x="30" y="448" xml:space="preserve">functions of its path.</text>
<text class="s" x="30" y="464" xml:space="preserve"></text>
<text class="s" x="30" y="480" xml:space="preserve">A context is handed down from an element</text>
<text class="s" x="30" y="496" xml:space="preserve">to each of its slots, changed for that slot.</text>
<text class="s" x="30" y="512" xml:space="preserve">Nothing flows up or between siblings.</text>
<text class="s" x="30" y="528" xml:space="preserve"></text>
<text class="s" x="30" y="544" xml:space="preserve">Root context here: branch order 0, index 0.</text>
<text class="s" x="30" y="560" xml:space="preserve">An axillary slot adds 1 to the order and</text>
<text class="s" x="30" y="576" xml:space="preserve">resets the index; an apical slot adds 1</text>
<text class="s" x="30" y="592" xml:space="preserve">to the index.</text>
<path class="lead" d="M372,20 L372,620"/>
<text class="t" x="400" y="40" xml:space="preserve">b. One shoot, as the model holds it</text>
<text class="s e" x="1170" y="40" xml:space="preserve">the shoot of plant / shoot, panel a</text>
<rect class="shade" x="574" y="120" width="608" height="222" rx="8"/>
<text class="s sn" x="584" y="136" xml:space="preserve">a shoot: the branch</text>
<rect class="grp" x="782" y="428" width="400" height="134" rx="8"/>
<text class="s sn" x="792" y="578" xml:space="preserve">built by one application of the phytomer rule</text>
