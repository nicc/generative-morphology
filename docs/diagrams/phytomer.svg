<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="A phytomer: internode, node, lateral organ, axillary bud and apical bud, with child slots numbered; an opposite node; a node bearing several buds">
<rect width="1200" height="540" fill="#fbfaf6"/>
<defs>
  <g id="leaf"><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/><path d="M50,-22 L185,-52" stroke-width="0.8"/></g>
  <path id="axbud" d="M12,-12 C11,-22 18,-32 25,-34 C26,-24 22,-15 12,-12 Z"/>
  <g id="apbud"><path d="M0,0 L0,-14"/><path d="M0,-14 C-9,-24 -7,-42 0,-50 C7,-42 9,-24 0,-14 Z"/></g>
</defs>
<style>
  .ink{fill:none;stroke:#1f1f1f;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
  .stem{stroke-width:3.2}
  .closed{fill:#1f1f1f}
  .lead{stroke:#777;stroke-width:0.8;fill:none}
  .dash{stroke-dasharray:4 4;stroke-width:1.2}
  text{font-family:Georgia,'Times New Roman',serif;font-size:14px;fill:#1f1f1f}
  .t{font-size:17px;font-style:italic}
  .s{font-size:12.5px;fill:#555}
  .m{font-family:Menlo,Consolas,monospace;font-size:12.5px}
  .n{font-family:Menlo,Consolas,monospace;font-size:11px;text-anchor:middle}
  .node{fill:#fbfaf6;stroke:#1f1f1f;stroke-width:1.6}
  .num{fill:#fbfaf6;stroke:#1f1f1f;stroke-width:1}
  .br{stroke:#a0522d;stroke-width:1.2;fill:none}
  .brt{fill:#a0522d;text-anchor:middle}
</style>
<text class="t" x="30" y="40">a. One phytomer (alternate)</text><g class="ink"><path class="dash" d="M200,400 L200,428"/><path class="stem" d="M200,400 L200,170"/><use href="#leaf" x="200" y="170"/><use href="#axbud" x="200" y="170"/><use href="#apbud" x="200" y="170"/></g><circle class="node" cx="200" cy="170" r="5"/><path class="lead" d="M192,290 L166,290"/><text x="160" y="294" text-anchor="end">internode</text><text class="s" x="160" y="310" text-anchor="end">an element</text><path class="lead" d="M193,173 L166,192"/><text x="160" y="198" text-anchor="end">node</text><text class="s" x="160" y="214" text-anchor="end">top of the internode;</text><text class="s" x="160" y="229" text-anchor="end">its slots attach here</text><path class="lead" d="M230,162 C252,190 264,202 280,208"/><text x="284" y="212">axil</text><text class="s" x="284" y="228">the angle between</text><text class="s" x="284" y="243">leaf and stem</text><circle class="num" cx="325" cy="125" r="9"/><text class="n" x="325" y="129">0</text><path class="lead" d="M222,140 L233,118"/><circle class="num" cx="238" cy="110" r="9"/><text class="n" x="238" y="114">1</text><path class="lead" d="M194,136 L178,126"/><circle class="num" cx="170" cy="122" r="9"/><text class="n" x="170" y="126">2</text><circle class="num" cx="40" cy="447" r="9"/><text class="n" x="40" y="451">0</text><text x="58" y="452">leaf: the lateral organ (an element)</text><circle class="num" cx="40" cy="470" r="9"/><text class="n" x="40" y="474">1</text><text x="58" y="475">axillary bud: starts a branch</text><circle class="num" cx="40" cy="493" r="9"/><text class="n" x="40" y="497">2</text><text x="58" y="498">apical bud: continues this axis</text><text class="m" x="30" y="526">grow(internode, leaf, bud, bud)</text><text class="t" x="420" y="40">b. Opposite: two leaves at one node</text><g class="ink"><path class="dash" d="M600,400 L600,428"/><path class="stem" d="M600,400 L600,170"/><use href="#leaf" x="600" y="170"/><use href="#axbud" x="600" y="170"/><g transform="translate(600,170) scale(-1,1)"><use href="#leaf"/><use href="#axbud"/></g><use href="#apbud" x="600" y="170"/></g><circle class="node" cx="600" cy="170" r="5"/><circle class="num" cx="725" cy="125" r="9"/><text class="n" x="725" y="129">2</text><circle class="num" cx="475" cy="125" r="9"/><text class="n" x="475" y="129">0</text><path class="lead" d="M622,140 L633,118"/><circle class="num" cx="638" cy="110" r="9"/><text class="n" x="638" y="114">3</text><path class="lead" d="M578,140 L567,118"/><circle class="num" cx="562" cy="110" r="9"/><text class="n" x="562" y="114">1</text><path class="lead" d="M600,118 L600,100"/><circle class="num" cx="600" cy="90" r="9"/><text class="n" x="600" y="94">4</text><text class="m" x="420" y="452">0, 2</text><text x="470" y="452">leaves</text><text class="m" x="420" y="475">1, 3</text><text x="470" y="475">their axillary buds</text><text class="m" x="420" y="498">4</text><text x="470" y="498">apical bud</text><text class="m" x="420" y="526">grow(internode, leaf, bud, leaf, bud, bud)</text><text class="t" x="840" y="40">c. Several buds at the end of a twig</text><g class="ink"><path class="dash" d="M1005,400 L1005,428"/><path class="stem" d="M1005,400 L1005,170"/><use href="#axbud" x="1005" y="170"/><g transform="translate(1005,170) scale(-1,1)"><use href="#axbud"/></g><g transform="translate(1005,170) rotate(38)"><use href="#axbud"/></g><g transform="translate(1005,170) scale(-1,1) rotate(38)"><use href="#axbud"/></g><use href="#apbud" x="1005" y="170"/></g><circle class="node" cx="1005" cy="170" r="5"/><path class="lead" d="M1031,144 L1055,130"/><circle class="num" cx="1063" cy="126" r="9"/><text class="n" x="1063" y="130">1</text><path class="lead" d="M979,144 L955,130"/><circle class="num" cx="947" cy="126" r="9"/><text class="n" x="947" y="130">0</text><path class="lead" d="M1041,168 L1061,172"/><circle class="num" cx="1071" cy="174" r="9"/><text class="n" x="1071" y="178">3</text><path class="lead" d="M969,168 L949,172"/><circle class="num" cx="939" cy="174" r="9"/><text class="n" x="939" y="178">2</text><path class="lead" d="M1005,118 L1005,100"/><circle class="num" cx="1005" cy="90" r="9"/><text class="n" x="1005" y="94">4</text><text class="m" x="840" y="452">0–3</text><text x="885" y="452">lateral buds sharing the node</text><text class="m" x="840" y="475">4</text><text x="885" y="475">apical bud</text><text class="s" x="840" y="498">Each bud is its own slot and grows one shoot.</text><text class="m" x="840" y="526">grow(internode, bud, bud, bud, bud, bud)</text><path class="lead" d="M400,20 L400,530 M820,20 L820,530"/></svg>
