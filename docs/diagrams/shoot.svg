<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-label="A shoot: phytomers repeated along an axis and nested in a branch, with slot paths; the same shoot as a tree of elements; the same pattern inside a compound leaf">
<rect width="1200" height="770" fill="#fbfaf6"/>
<defs>
  <g id="leaf"><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/><path d="M50,-22 L185,-52" stroke-width="0.8"/></g>
  <path id="axbud" d="M12,-12 C11,-22 18,-32 25,-34 C26,-24 22,-15 12,-12 Z"/>
  <g id="apbud"><path d="M0,0 L0,-14"/><path d="M0,-14 C-9,-24 -7,-42 0,-50 C7,-42 9,-24 0,-14 Z"/></g>
</defs>
<style>
  .ink{fill:none;stroke:#1f1f1f;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
  .stem{stroke-width:3.2}
  .closed{fill:#1f1f1f}
  .lead{stroke:#777;stroke-width:0.8;fill:none}
  .dash{stroke-dasharray:4 4;stroke-width:1.2}
  text{font-family:Georgia,'Times New Roman',serif;font-size:14px;fill:#1f1f1f}
  .t{font-size:17px;font-style:italic}
  .s{font-size:12.5px;fill:#555}
  .m{font-family:Menlo,Consolas,monospace;font-size:12.5px}
  .n{font-family:Menlo,Consolas,monospace;font-size:11px;text-anchor:middle}
  .node{fill:#fbfaf6;stroke:#1f1f1f;stroke-width:1.6}
  .num{fill:#fbfaf6;stroke:#1f1f1f;stroke-width:1}
  .br{stroke:#a0522d;stroke-width:1.2;fill:none}
  .brt{fill:#a0522d;text-anchor:middle}
</style>
<text class="t" x="30" y="40">a. A shoot: phytomers repeated and nested</text><g class="ink"><path class="stem" d="M270,680 L270,230"/><g transform="translate(270,530) scale(1,1) rotate(14)"><use href="#leaf"/></g><g transform="translate(270,380) scale(-1,1) rotate(14)"><use href="#leaf"/></g><g transform="translate(270,380) scale(-1,1)"><use href="#axbud" class="closed"/></g><g transform="translate(270,230) scale(1,1) rotate(14)"><use href="#leaf"/></g><g transform="translate(270,230) scale(1,1)"><use href="#axbud"/></g><use href="#apbud" x="270" y="230"/><path class="stem" stroke-width="2.4" d="M270,530 L402,354"/><g transform="translate(336,442) scale(.6) rotate(30)"><use href="#leaf"/></g><g transform="translate(336,442) rotate(37) scale(.7)"><use href="#axbud"/></g><g transform="translate(402,354) rotate(37) scale(-.6,.6) rotate(20)"><use href="#leaf"/></g><g transform="translate(402,354) rotate(37) scale(-.7,.7)"><use href="#axbud"/></g><g transform="translate(402,354) rotate(37) scale(.75)"><use href="#apbud"/></g></g><circle class="node" cx="270" cy="530" r="4.5"/><circle class="node" cx="270" cy="380" r="4.5"/><circle class="node" cx="270" cy="230" r="4.5"/><circle class="node" cx="336" cy="442" r="4.5"/><circle class="node" cx="402" cy="354" r="4.5"/><path class="br" d="M60,675 L52,675 L52,535 L60,535"/><text class="brt" x="42" y="605.0" transform="rotate(-90 42 605.0)">phytomer</text><path class="br" d="M60,525 L52,525 L52,385 L60,385"/><text class="brt" x="42" y="455.0" transform="rotate(-90 42 455.0)">phytomer</text><path class="br" d="M60,375 L52,375 L52,235 L60,235"/><text class="brt" x="42" y="305.0" transform="rotate(-90 42 305.0)">phytomer</text><text class="m" x="258" y="610" text-anchor="end">root</text><text class="s" x="258" y="625" text-anchor="end">internode</text><text class="m" x="258" y="455" text-anchor="end">2</text><text class="s" x="258" y="470" text-anchor="end">internode</text><text class="m" x="258" y="290" text-anchor="end">2.2</text><text class="s" x="258" y="305" text-anchor="end">internode</text><text class="m" x="256" y="172" text-anchor="end">2.2.2</text><text class="s" x="256" y="187" text-anchor="end">apical bud, open</text><path class="lead" d="M292,200 L310,176"/><text class="m" x="314" y="160" text-anchor="start">2.2.1</text><text class="s" x="314" y="175" text-anchor="start">axillary bud, open</text><path class="lead" d="M244,352 L230,336"/><text class="m" x="226" y="322" text-anchor="end">2.1</text><text class="s" x="226" y="337" text-anchor="end">closed</text><path class="lead" d="M308,478 L466,478"/><text class="m" x="470" y="476" text-anchor="start">1</text><text class="s" x="470" y="491" text-anchor="start">internode of a branch:</text><text class="s" x="470" y="506">the phytomer again,</text><text class="s" x="470" y="521">from an axillary slot</text><text class="m" x="438" y="308" text-anchor="start">1.2.2</text><text class="s" x="438" y="323" text-anchor="start">apical bud of the branch</text><path class="lead" d="M400,566 L394,536"/><text class="m" x="396" y="582" text-anchor="start">0</text><text class="s" x="396" y="597" text-anchor="start">leaf</text><text class="s" x="30" y="708">Each phytomer is one internode and what its node bears.</text><text class="s" x="30" y="724">Paths are slot indices from the root: 0 leaf, 1 axillary, 2 apical.</text><text class="s" x="30" y="740">Main axis: branch order 0. Branch: order 1. Open bud: outline. Closed: filled.</text><text class="s" x="30" y="756">Anything cut off at a slot (a branch, a leaf, a bud) is itself a shoot.</text><path class="lead" d="M615,20 L615,760"/><text class="t" x="640" y="40">b. The same shoot as data</text><text class="m" x="640" y="78" xml:space="preserve">internode</text><text class="m" x="920" y="78" style="fill:#777">root</text><text class="m" x="640" y="99" xml:space="preserve">├ 0  leaf</text><text class="m" x="920" y="99" style="fill:#777">0</text><text class="m" x="640" y="120" xml:space="preserve">├ 1  internode</text><text class="m" x="920" y="120" style="fill:#777">1</text><text class="m" x="640" y="141" xml:space="preserve">│    ├ 0  leaf</text><text class="m" x="920" y="141" style="fill:#777"></text><text class="m" x="640" y="162" xml:space="preserve">│    ├ 1  bud</text><text class="m" x="920" y="162" style="fill:#777"></text><text class="m" x="640" y="183" xml:space="preserve">│    └ 2  internode</text><text class="m" x="920" y="183" style="fill:#777">1.2</text><text class="m" x="640" y="204" xml:space="preserve">│         ├ 0  leaf</text><text class="m" x="920" y="204" style="fill:#777"></text><text class="m" x="640" y="225" xml:space="preserve">│         ├ 1  bud</text><text class="m" x="920" y="225" style="fill:#777"></text><text class="m" x="640" y="246" xml:space="preserve">│         └ 2  bud</text><text class="m" x="920" y="246" style="fill:#777">1.2.2</text><text class="m" x="640" y="267" xml:space="preserve">└ 2  internode</text><text class="m" x="920" y="267" style="fill:#777">2</text><text class="m" x="640" y="288" xml:space="preserve">     ├ 0  leaf</text><text class="m" x="920" y="288" style="fill:#777"></text><text class="m" x="640" y="309" xml:space="preserve">     ├ 1  closed</text><text class="m" x="920" y="309" style="fill:#777">2.1</text><text class="m" x="640" y="330" xml:space="preserve">     └ 2  internode</text><text class="m" x="920" y="330" style="fill:#777">2.2</text><text class="m" x="640" y="351" xml:space="preserve">          ├ 0  leaf</text><text class="m" x="920" y="351" style="fill:#777"></text><text class="m" x="640" y="372" xml:space="preserve">          ├ 1  bud</text><text class="m" x="920" y="372" style="fill:#777">2.2.1</text><text class="m" x="640" y="393" xml:space="preserve">          └ 2  bud</text><text class="m" x="920" y="393" style="fill:#777">2.2.2</text><text class="s" x="920" y="56">path</text><text class="s" x="640" y="428">An element has slots. Each slot holds one shoot:</text><text class="s" x="640" y="444">an element with its own slots, an open bud, or closed.</text><path class="lead" d="M615,470 L1180,470"/><text class="t" x="640" y="505">c. The same pattern inside a leaf</text><g class="ink"><path stroke-width="2.2" d="M680,650 L1010,650"/><g transform="translate(790,650) scale(.5) rotate(-28)"><use href="#leaf"/></g><g transform="translate(900,650) scale(.5,-.5) rotate(-28)"><use href="#leaf"/></g><g transform="translate(1010,650) scale(.5) rotate(22)"><use href="#leaf"/></g></g><circle class="node" cx="790" cy="650" r="3.5"/><circle class="node" cx="900" cy="650" r="3.5"/><circle class="node" cx="1010" cy="650" r="3.5"/><path class="lead" d="M730,656 L730,684"/><text x="680" y="700">rachis segment</text><text class="s" x="680" y="716">an element, in the role of the internode</text><path class="lead" d="M842,588 L830,560"/><text x="780" y="538">leaflet</text><text class="s" x="780" y="554">in the role of the leaf</text><text class="s" x="640" y="756">A compound leaf is a shoot too, built by a rule of the same shape.</text></svg>
