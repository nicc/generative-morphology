<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-label="Stages along one axis, each a contraction or an expansion with the leaf archetype transformed; and fusion as an annotation beside five separate sepals">
<rect width="1200" height="690" fill="#fbfaf6"/>
<defs>
  <g id="leaf"><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/><path d="M50,-22 L185,-52" stroke-width="0.8"/></g>
  <path id="axbud" d="M12,-12 C11,-22 18,-32 25,-34 C26,-24 22,-15 12,-12 Z"/>
  <g id="apbud"><path d="M0,0 L0,-14"/><path d="M0,-14 C-9,-24 -7,-42 0,-50 C7,-42 9,-24 0,-14 Z"/></g>
</defs>
<style>
  .ink{fill:none;stroke:#1f1f1f;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
  .stem{stroke-width:3.2}
  .closed{fill:#1f1f1f}
  .lead{stroke:#777;stroke-width:0.8;fill:none}
  .dash{stroke-dasharray:4 4;stroke-width:1.2}
  text{font-family:Georgia,'Times New Roman',serif;font-size:14px;fill:#1f1f1f}
  .t{font-size:17px;font-style:italic}
  .s{font-size:12.5px;fill:#555}
  .m{font-family:Menlo,Consolas,monospace;font-size:12.5px}
  .n{font-family:Menlo,Consolas,monospace;font-size:11px;text-anchor:middle}
  .node{fill:#fbfaf6;stroke:#1f1f1f;stroke-width:1.6}
  .num{fill:#fbfaf6;stroke:#1f1f1f;stroke-width:1}
  .br{stroke:#a0522d;stroke-width:1.2;fill:none}
  .brt{fill:#a0522d;text-anchor:middle}
</style>
<text class="t" x="30" y="40">a. Stages along one axis: one archetype, transformed</text><g class="ink"><path class="stem" d="M230,600 L230,236"/><g transform="translate(230,490) scale(1.0,1.0) rotate(10)"><use href="#leaf"/></g><g transform="translate(230,380) scale(-1.0,1.0) rotate(10)"><use href="#leaf"/></g><g transform="translate(230,330) scale(0.42,0.42) rotate(-22)"><use href="#leaf"/></g><g transform="translate(230,330) scale(-0.42,0.42) rotate(-22)"><use href="#leaf"/></g><g transform="translate(230,262) scale(0.8,0.8) rotate(-22)"><use href="#leaf"/></g><g transform="translate(230,262) scale(-0.8,0.8) rotate(-22)"><use href="#leaf"/></g><g transform="translate(230,236) scale(0.28,0.28) rotate(-22)"><use href="#leaf"/></g><g transform="translate(230,236) scale(-0.28,0.28) rotate(-22)"><use href="#leaf"/></g><g transform="translate(230,236)"><path class="closed" d="M0,0 C-5,-7 -4,-16 0,-20 C4,-16 5,-7 0,0 Z"/></g></g><circle class="node" cx="230" cy="490" r="4"/><circle class="node" cx="230" cy="380" r="4"/><circle class="node" cx="230" cy="330" r="4"/><circle class="node" cx="230" cy="262" r="4"/><circle class="node" cx="230" cy="236" r="4"/><path class="br" d="M462,598 L470,598 L470,382 L462,382"/><text x="482" y="488">vegetative</text><text class="s" x="482" y="504">an expansion (+) · leaf: the archetype</text><path class="lead" d="M300,281 L464,281"/><text x="482" y="285">calyx</text><text class="s" x="482" y="301">a contraction (−) · sepal</text><path class="lead" d="M280,207 L464,221"/><text x="482" y="225">stamens and pistil</text><text class="s" x="482" y="241">a contraction (−) · stamen, carpel</text><path class="lead" d="M360,168 L464,161"/><text x="482" y="165">corolla</text><text class="s" x="482" y="181">an expansion (+) · petal</text><text class="s" x="482" y="110">fruit: an expansion, added later</text><text class="s" x="30" y="632">A stage is a place along an axis: a run of phytomers.</text><text class="s" x="30" y="648">Each stage is an expansion or a contraction, fixed by its place in the order.</text><text class="s" x="30" y="664">Every organ is the one leaf archetype, scaled for its stage (here by size only).</text><text class="s" x="30" y="680">Every axis, the main one and each branch, runs the same sequence.</text><path class="lead" d="M730,20 L730,680"/><text class="t" x="760" y="40">b. Fusion is an annotation</text><g class="ink"><g transform="translate(855,260) rotate(-118.3) scale(.62)" ><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(855,260) rotate(-96.3) scale(.62)" ><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(855,260) rotate(-74.3) scale(.62)" ><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(855,260) rotate(-52.3) scale(.62)" ><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(855,260) rotate(-30.299999999999997) scale(.62)" ><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g></g><g class="ink"><path class="stem" d="M855,260 L855,320"/></g><circle class="node" cx="855" cy="260" r="4"/><g class="ink" style="stroke-width:5.5"><g transform="translate(1085,260) rotate(-118.3) scale(.62)" ><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(1085,260) rotate(-96.3) scale(.62)" ><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(1085,260) rotate(-74.3) scale(.62)" ><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(1085,260) rotate(-52.3) scale(.62)" ><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(1085,260) rotate(-30.299999999999997) scale(.62)" ><path d="M0,0 L50,-22"/><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g></g><g style="fill:#fbfaf6;stroke:#fbfaf6;stroke-width:0.4"><g transform="translate(1085,260) rotate(-118.3) scale(.62)"><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(1085,260) rotate(-96.3) scale(.62)"><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(1085,260) rotate(-74.3) scale(.62)"><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(1085,260) rotate(-52.3) scale(.62)"><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g><g transform="translate(1085,260) rotate(-30.299999999999997) scale(.62)"><path d="M50,-22 C85,-75 155,-75 185,-52 C155,-18 90,-8 50,-22 Z"/></g></g><g class="ink"><g transform="translate(1085,260) rotate(-118.3) scale(.62)"><path d="M0,0 L50,-22"/></g><g transform="translate(1085,260) rotate(-96.3) scale(.62)"><path d="M0,0 L50,-22"/></g><g transform="translate(1085,260) rotate(-74.3) scale(.62)"><path d="M0,0 L50,-22"/></g><g transform="translate(1085,260) rotate(-52.3) scale(.62)"><path d="M0,0 L50,-22"/></g><g transform="translate(1085,260) rotate(-30.299999999999997) scale(.62)"><path d="M0,0 L50,-22"/></g></g><g class="ink"><path class="stem" d="M1085,260 L1085,320"/></g><circle class="node" cx="1085" cy="260" r="4"/><text x="855" y="350" text-anchor="middle">the shoot</text><text class="s" x="855" y="366" text-anchor="middle">five sepals, five slots</text><text class="s" x="855" y="381" text-anchor="middle">what the plain view draws</text><text x="1085" y="350" text-anchor="middle">the styled drawing</text><text class="s" x="1085" y="366" text-anchor="middle">the union of the group</text><text class="s" x="1085" y="381" text-anchor="middle">internal edges gone</text><text class="m" x="760" y="430">slots at this node   0  2  4  6  8      (sepals)</text><text class="m" x="760" y="452">fusion group         { 0, 2, 4, 6, 8 }</text><text class="s" x="760" y="488">Generation computes the group from the finished shoot</text><text class="s" x="760" y="504">and keeps it beside the shoot. The shoot is unchanged:</text><text class="s" x="760" y="520">each sepal keeps its slot, path, seed and life.</text><text class="s" x="760" y="536">Render reads the group; it does not work fusion out.</text></svg>
